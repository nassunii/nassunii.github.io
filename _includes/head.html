<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link href="https://gmpg.org/xfn/11" rel="profile">

  <!-- Lanyon/Poole styles -->
  <link rel="stylesheet" href="{{ '/public/css/poole.css'   | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/syntax.css'  | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/lanyon.css'  | relative_url }}">

  <!-- Your overrides (optional) -->
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=PT+Serif:400,400italic,700%7CPT+Sans:400&display=swap">

  <!-- Icons & feed -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ '/public/apple-touch-icon-precomposed.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/public/favicon.ico' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS" href="{{ '/atom.xml' | relative_url }}">

  {% if site.google_analytics_id %}
    <script async src="https://www.google-analytics.com/analytics.js"></script>
    <script>
      window.ga=window.ga||function(){(ga.q=ga.q||[]).push(arguments)};ga.l=+new Date;
      ga('create','{{ site.google_analytics_id }}','auto');ga('send','pageview');
    </script>
  {% endif %}
</head>
