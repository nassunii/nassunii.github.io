<!doctype html>
<html lang="en-us">
  {% include head.html %}
  <body class="theme-base-0e layout-reverse">
    {% include sidebar.html %}

    <!-- Wrap is the content to shift when toggling the sidebar. -->
    <div class="wrap">
      <div class="masthead">
        <div class="container">
          <h3 class="masthead-title">
            <a href="{{ '/' | relative_url }}" title="Home">{{ site.title }}</a>
            {% if site.tagline %}<small>{{ site.tagline }}</small>{% endif %}
          </h3>
        </div>
      </div>

      <main id="main" class="container content" role="main">
        {{ content }}
      </main>
    </div>

    <label for="sidebar-checkbox" class="sidebar-toggle" aria-label="Toggle navigation"></label>
    <!-- If you don't have this file, you can remove this line safely. -->
    <script src="{{ '/public/js/script.js' | relative_url }}" defer></script>
  </body>
</html>
